name: Build navigation index

# Rigenera links.html ad ogni push, scansionando le pagine HTML del repo.
# 每次 push 时自动扫描仓库 HTML 并重建 links.html。

on:
  push:
    paths-ignore:
      - "links.html" # evita il loop: il commit automatico non ri-attiva il workflow

permissions:
  contents: write

concurrency:
  group: build-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate links.html
        run: node scripts/build-index.js

      - name: Commit links.html if changed
        run: |
          if git diff --quiet -- links.html; then
            echo "links.html invariato — nessun commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add links.html
            git commit -m "chore: rigenera links.html [skip ci]"
            git push
          fi
